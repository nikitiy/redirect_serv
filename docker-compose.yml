services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: redirect_serv_app
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
    volumes:
      - ./src:/app/src
    restart: unless-stopped
    networks:
      - lya_network
    expose:
      - "8002"

networks:
  lya_network:
    name: lya_network
    external: true
